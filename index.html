<style>

    --paper:#FFF9EE;

    font-family:'Noto Sans TC', sans-serif;
    background:var(--purple);
    color:var(--ink);
    min-height:100vh;

    font-family:'Baloo 2', sans-serif;

    background:var(--yellow);

    font-size:15px;

  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:10px 0;}

/* ---------------- storage helpers (backed by Firebase Realtime Database) ---------------- */
// Keys like "group:5" or "meta:started" are mapped to DB paths "group/5", "meta/started".
function toPath(key){ return key.replace(/:/g, '/'); }

async function sget(key, def){
  try{
    const snap = await db.ref(toPath(key)).once('value');
    if(!snap.exists()) return def;
    const raw = snap.val();
    if(typeof raw === 'string'){ try{ return JSON.parse(raw); }catch(e){ return raw; } }
    return raw;
  }catch(e){ console.error('firebase get failed', key, e); return def; }
}
async function sset(key, value){
  try{ await db.ref(toPath(key)).set(JSON.stringify(value)); return true; }
  catch(e){ console.error('firebase set failed', key, e); return false; }
}
async function sdelete(key){
  try{ await db.ref(toPath(key)).remove(); return true; }
  catch(e){ console.error('firebase delete failed', key, e); return false; }
}
async function slistIds(node){
  try{
    const snap = await db.ref(node).once('value');
    if(!snap.exists()) return [];
    return Object.keys(snap.val());
  }catch(e){ return []; }
}

/* ---- roster helpers: each student is stored as their own DB node (keyed by name)
   so 200 people can join/self-register at the same time without overwriting each other ---- */
function rkey(name){ return 'roster:' + encodeURIComponent(name); }
async function getRosterList(){
  const ids = await slistIds('roster');
  const list = [];
  for(const id of ids){
    const val = await sget('roster:'+id, null);
    if(val) list.push(val);
  }
  return list;
}
async function setRosterPerson(person){ return sset(rkey(person.name), person); }
async function deleteRosterPerson(name){ return sdelete(rkey(name)); }

/* ---- 1. roster & grouping ---- */

        <div class="row" style="margin-top:8px;">

          <button onclick="addProgram()">新增</button>
        </div>
        <hr style="border:none;border-top:2px dashed #ddd;margin:16px 0;">
        <h3>② 學生自己加入</h3>
        <p class="muted">分享網址給學生後，他們選「我是學生」，自己輸入姓名、選學程即可加入名單，不用你手動輸入。${started? '<br><b>⚠️ 遊戲已開始，暫時無法有新的人加入。</b>':''}</p>
        <hr style="border:none;border-top:2px dashed #ddd;margin:16px 0;">
        <h3>（可選）批次匯入現成名單</h3>
        <p class="muted">如果你已經有名單，也可以直接匯入（欄位需含「姓名」與「學程」）。</p>
        <input type="file" id="rosterFile" accept=".xlsx,.xls,.csv">
        <div class="row" style="margin-top:10px;">
          <button class="mint" onclick="handleRosterUpload()">匯入並加入名單</button>
        </div>
        <div id="rosterMsg"></div>
        <div class="row" style="margin-top:10px;">
          <input id="manualName" placeholder="姓名" style="width:100px;">
          <input id="manualProgram" placeholder="學程" style="width:100px;">
          <button onclick="handleManualAdd()">手動新增一人</button>
        </div>
      </div>
      <div class="card">
        <div class="row" style="justify-content:space-between;">
          <h3>目前名單（共 ${roster.length} 人）</h3>
          <button class="secondary" style="padding:4px 10px;" onclick="renderTeacher('roster')">🔄 重新整理</button>
        </div>
        <div class="name-list">
          <table><thead><tr><th>姓名</th><th>學程</th><th>組別</th><th></th></tr></thead>
          <tbody>${roster.map(p=>`<tr><td>${p.name}</td><td>${p.program||'—'}</td><td>${p.groupId? '第'+p.groupId+'組('+p.order+')':'—'}</td><td><button class="secondary" style="padding:2px 8px;" onclick="removeRosterPerson('${encodeURIComponent(p.name)}')">刪除</button></td></tr>`).join('') || '<tr><td colspan="4" class="muted">尚無名單，等學生自己加入吧</td></tr>'}</tbody></table>
        </div>
        <div class="row" style="margin-top:12px;">

        </div>
      </div>
    </div>
    <div class="card">
      <h3>自動分組</h3>
      <p class="muted">每組 6 人，系統會盡量平均混合不同學程，避免同組都是同學程。分組後會打亂組內順序（第1~6位）決定接力順序。分組後名單就會鎖定，學生無法再自己加入。</p>

async function addProgram(){
  const input = document.getElementById('newProgramInput');
  const val = input.value.trim();
  if(!val) return;
  const programs = await sget('config:programs', []);
  if(!programs.includes(val)) programs.push(val);
  await sset('config:programs', programs);
  await renderTeacher('roster');
}
async function removeProgram(i){
  const programs = await sget('config:programs', []);
  programs.splice(i,1);
  await sset('config:programs', programs);
  await renderTeacher('roster');
}

async function renderGroupPreview(){
  const roster = await getRosterList();
  const el = document.getElementById('groupPreview');
  if(!el) return;
  const groupIds = [...new Set(roster.filter(p=>p.groupId).map(p=>p.groupId))].sort((a,b)=>a-b);
  if(groupIds.length===0){ el.innerHTML = '<p class="muted">尚未分組。</p>'; return; }
  el.innerHTML = `<div class="row" style="flex-wrap:wrap;">` + groupIds.map(gid=>{
    const members = roster.filter(p=>p.groupId===gid).sort((a,b)=>a.order-b.order);
    return `<div class="bank-cat" style="min-width:180px;"><h3>第 ${gid} 組</h3>${members.map(m=>`<div class="chip">${m.order}. ${m.name} <span class="muted">(${m.program||'—'})</span></div>`).join('')}</div>`;
  }).join('') + `</div>`;
}

async function handleRosterUpload(){
  const fileInput = document.getElementById('rosterFile');
  const msg = document.getElementById('rosterMsg');
  if(!fileInput.files.length){ msg.innerHTML = '<div class="warn">請先選擇檔案</div>'; return; }
  const file = fileInput.files[0];
  const buf = await file.arrayBuffer();
  try{
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    let added = 0;
    for(const r of rows){
      const name = (r['姓名']||r['name']||r['Name']||'').toString().trim();
      const program = (r['學程']||r['program']||r['Program']||'').toString().trim();
      if(name){ await setRosterPerson({name, program}); added++; }
    }
    msg.innerHTML = `<div class="ok">已匯入 ${added} 筆資料 ✅</div>`;
    await renderTeacher('roster');
  }catch(e){
    msg.innerHTML = '<div class="warn">讀取失敗，請確認檔案格式（需含「姓名」「學程」欄位）</div>';
  }
}

async function handleManualAdd(){
  const name = document.getElementById('manualName').value.trim();
  const program = document.getElementById('manualProgram').value.trim();
  if(!name) return;
  await setRosterPerson({name, program});
  await renderTeacher('roster');
}

function shuffleArr(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

async function handleAutoGroup(){
  let roster = await getRosterList();
  if(roster.length < 6){ alert('人數不足6人，無法分組'); return; }
  roster.forEach(p=>{ delete p.groupId; delete p.order; });
  const programs = [...new Set(roster.map(p=>p.program||'未分類'))];
  const buckets = {};
  programs.forEach(p=> buckets[p] = shuffleArr(roster.filter(x=>(x.program||'未分類')===p)));
  const idx = {}; programs.forEach(p=>idx[p]=0);
  let groups = []; let current = [];
  let remaining = roster.length;
  while(remaining>0){
    let pickedAny=false;
    for(const p of shuffleArr(programs)){
      if(idx[p] < buckets[p].length){
        current.push(buckets[p][idx[p]]); idx[p]++; remaining--; pickedAny=true;
        if(current.length===6){ groups.push(current); current=[]; }
      }
    }
    if(!pickedAny) break;
  }
  if(current.length) groups.push(current);
  groups.forEach((g,gi)=>{
    const order = shuffleArr(g);
    order.forEach((m,i)=>{ m.groupId = gi+1; m.order = i+1; });
  });
  // write each person's updated groupId/order back to their own roster node
  const flat = groups.flat();
  for(const m of flat){ await setRosterPerson(m); }
  // clear old group state, create fresh group docs
  const oldIds = await slistIds('group');
  for(const id of oldIds){ await sdelete('group:'+id); }
  for(let gi=0; gi<groups.length; gi++){
    const gid = gi+1;
    const members = groups[gi].map(m=>({name:m.name, program:m.program, order:m.order}));
    await sset('group:'+gid, {
      id: gid,
      members,
      assignments: {},
      turnIndex: 0,
      image: null,
      dialogueText: null,
      title: null,
      started: false
    });
  }
  await sset('meta:groupCount', groups.length);
  alert('分組完成！共 ' + groups.length + ' 組。');
  await renderTeacher('roster');
}

async function handleBankUpload(){
  const fileInput = document.getElementById('bankFile');
  const msg = document.getElementById('bankMsg');
  if(!fileInput.files.length){ msg.innerHTML = '<div class="warn">請先選擇檔案</div>'; return; }
  const file = fileInput.files[0];
  const buf = await file.arrayBuffer();
  const catMap = {'空間':'space','時間':'time','主角':'protagonist','配角':'sidekick','對話情境':'dialogue','對話':'dialogue',
    'space':'space','time':'time','protagonist':'protagonist','sidekick':'sidekick','dialogue':'dialogue'};
  try{
    const wb = XLSX.read(buf, {type:'array'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    let bank = await sget('bank', DEFAULT_BANK);
    let added = 0;
    rows.forEach(r=>{
      const catRaw = (r['類別']||r['category']||'').toString().trim();
      const content = (r['內容']||r['content']||'').toString().trim();
      const cat = catMap[catRaw];
      if(cat && content){ bank[cat] = bank[cat]||[]; bank[cat].push(content); added++; }
    });
    await sset('bank', bank);
    msg.innerHTML = `<div class="ok">已匯入 ${added} 筆題目 ✅</div>`;
    await renderTeacher('bank');
  }catch(e){
    msg.innerHTML = '<div class="warn">讀取失敗，請確認欄位格式</div>';
  }
}

async function handleStartGame(){
  const roster = await getRosterList();

  const bank = await sget('bank', DEFAULT_BANK);
  const groupIds = [...new Set(roster.map(p=>p.groupId))];
  for(const gid of groupIds){
    const g = await sget('group:'+gid, null);
    if(!g) continue;
    const assignments = {};
    CATS.slice(0,5).forEach((cat, i)=>{
      const order = i+1;
      const pool = bank[cat] && bank[cat].length ? bank[cat] : ['（題庫空白）'];

      assignments[order] = {category: cat, content};

    g.started = true;

async function studentGroupLoop(){
  // pull the latest version of this student's own record (picks up groupId once the teacher groups everyone)
  const me = await sget(rkey(currentStudent.name), null);
  if(me) currentStudent = me;
  if(!currentStudent.groupId){
    renderStudentPendingGroup();
    return;
  }
  const started = await sget('meta:started', false);
  const g = await sget('group:'+currentStudent.groupId, null);
  if(!g) return;
  const myOrder = currentStudent.order;
  if(g.turnIndex>=6){
    await renderStudentBigScreenMirror();
    return;
  }
  const isMyTurn = started && g.turnIndex+1 === myOrder && myOrder<=6;
  // if it's my turn and I haven't been shown the "go" screen yet, render the play screen once
  if(isMyTurn){
    if(document.getElementById('studentPlayScreen')) return; // already showing, let inner logic handle
    renderStudentPlay(g);
    return;
  }
  renderStudentWaiting(g, started);
}

let ctx, canvasEl, drawing=false, lastX=0, lastY=0, currentColor='#241B3A', strokes=[], timerInterval, timeLeft, dialogueBubbleEl=null;

async function setupDrawTurn(g, assignment, myOrder){
  // slot machine reveal animation
  const bank = await sget('bank', DEFAULT_BANK);
  const cat = assignment.category;
  const pool = (bank[cat]&&bank[cat].length)? bank[cat] : [assignment.content];
  const revealEl = document.getElementById('slotReveal');
  let count = 0;
  const spin = setInterval(()=>{
    revealEl.textContent = pool[Math.floor(Math.random()*pool.length)];
    count++;
    if(count>10){ clearInterval(spin); revealEl.textContent = assignment.content; startDrawArea(g, myOrder); }
  }, 90);
}

function startDrawArea(g, myOrder){
  document.getElementById('drawArea').style.display='block';
  canvasEl = document.getElementById('drawCanvas');
  ctx = canvasEl.getContext('2d');
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvasEl.width,canvasEl.height);
  strokes = [];
  dialogueBubbleEl = null;
  if(g.image){
    const img = new Image();
    img.onload = ()=>{ ctx.drawImage(img,0,0,canvasEl.width,canvasEl.height); };
    img.src = g.image;
  }
  currentColor = COLORS[0];
  bindCanvasEvents();
  startTimer();
}

function bindCanvasEvents(){
  const getPos = (e)=>{
    const rect = canvasEl.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
    return {x: cx*(canvasEl.width/rect.width), y: cy*(canvasEl.height/rect.height)};
  };
  const start = (e)=>{ e.preventDefault(); drawing=true; const p=getPos(e); lastX=p.x; lastY=p.y; strokes.push(canvasEl.toDataURL()); };
  const move = (e)=>{
    if(!drawing) return; e.preventDefault();
    const p = getPos(e);
    ctx.strokeStyle = currentColor; ctx.lineWidth=5; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke();
    lastX=p.x; lastY=p.y;
  };
  const end = ()=>{ drawing=false; };
  canvasEl.addEventListener('mousedown', start);
  canvasEl.addEventListener('mousemove', move);
  canvasEl.addEventListener('mouseup', end);
  canvasEl.addEventListener('mouseleave', end);
  canvasEl.addEventListener('touchstart', start, {passive:false});
  canvasEl.addEventListener('touchmove', move, {passive:false});
  canvasEl.addEventListener('touchend', end);
}

function setColor(c, el){
  currentColor = c;
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}

function undoStroke(){
  if(strokes.length===0) return;
  const last = strokes.pop();
  const img = new Image();
  img.onload = ()=>{ ctx.clearRect(0,0,canvasEl.width,canvasEl.height); ctx.drawImage(img,0,0); };
  img.src = last;
}

function createDialogueBubble(){
  const text = document.getElementById('dialogueInput').value.trim();
  if(!text) return;
  const wrap = document.getElementById('canvasWrap');
  if(dialogueBubbleEl){ dialogueBubbleEl.remove(); }
  const bubble = document.createElement('div');
  bubble.className = 'dialogue-bubble';
  bubble.textContent = text;
  const wrapRect = wrap.getBoundingClientRect();
  bubble.style.left = (wrapRect.width/2 - 60) + 'px';
  bubble.style.top = '10px';
  wrap.appendChild(bubble);
  dialogueBubbleEl = bubble;
  makeDraggable(bubble, wrap);
  document.getElementById('dialogueHint').style.display='block';
  document.getElementById('stampRow').style.display='flex';
}

function makeDraggable(el, container){
  let offsetX=0, offsetY=0, dragging=false;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', (e)=>{
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const rect = el.getBoundingClientRect();
    offsetX = e.clientX - rect.left;
    offsetY = e.clientY - rect.top;
  });
  el.addEventListener('pointermove', (e)=>{
    if(!dragging) return;
    const crect = container.getBoundingClientRect();
    let x = e.clientX - crect.left - offsetX;
    let y = e.clientY - crect.top - offsetY;
    x = Math.max(0, Math.min(x, crect.width - el.offsetWidth));
    y = Math.max(0, Math.min(y, crect.height - el.offsetHeight));
    el.style.left = x + 'px';
    el.style.top = y + 'px';
  });
  const stop = ()=>{ dragging=false; };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}

function finalizeDialogueStamp(){
  if(!dialogueBubbleEl || !canvasEl) return;
  const wrap = document.getElementById('canvasWrap');
  const wrapRect = wrap.getBoundingClientRect();
  const bubbleRect = dialogueBubbleEl.getBoundingClientRect();
  const scaleX = canvasEl.width / wrapRect.width;
  const scaleY = canvasEl.height / wrapRect.height;
  const x = (bubbleRect.left - wrapRect.left) * scaleX;
  const y = (bubbleRect.top - wrapRect.top) * scaleY;
  const w = bubbleRect.width * scaleX;
  const h = bubbleRect.height * scaleY;
  const text = dialogueBubbleEl.textContent;

  strokes.push(canvasEl.toDataURL());
  ctx.save();
  ctx.fillStyle='rgba(255,210,63,0.95)';
  ctx.strokeStyle='#241B3A'; ctx.lineWidth=3;
  roundRect(ctx, x, y, w, h, 12); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#241B3A'; ctx.font='bold 16px "Noto Sans TC"'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text, x+w/2, y+h/2);
  ctx.restore();

  dialogueBubbleEl.remove();
  dialogueBubbleEl = null;
  document.getElementById('dialogueHint').style.display='none';
  document.getElementById('stampRow').style.display='none';
  const input = document.getElementById('dialogueInput');
  if(input) input.value = '';
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

async function startTimer(){
  const secs = await sget('meta:timerSec', 20);
  timeLeft = secs;
  const disp = document.getElementById('timerDisplay');
  if(disp) disp.textContent = timeLeft + ' 秒';
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timeLeft--;
    if(disp) disp.textContent = Math.max(timeLeft,0) + ' 秒';
    if(timeLeft<=0){ clearInterval(timerInterval); submitDrawTurn(); }
  }, 1000);
}

async function submitDrawTurn(){
  clearInterval(timerInterval);
  if(!canvasEl) return;
  const dataUrl = canvasEl.toDataURL('image/png');
  const g = await sget('group:'+currentStudent.groupId, null);
  if(!g) return;
  if(g.turnIndex+1 !== currentStudent.order) { renderStudentGroup(); return; } // already advanced
  g.image = dataUrl;
  g.turnIndex = currentStudent.order;
  await sset('group:'+currentStudent.groupId, g);
  canvasEl = null;
  renderStudentGroup();
}

/* ---- title turn (order 6) ---- */
function renderTitleTurnHTML(g){
  return `
    <div class="center">
      <h2>🏷️ 最後一棒：幫這幅曠世巨作取個名字！</h2>
      <div class="canvas-frame" style="margin-top:10px;">
        <img src="${g.image||''}" style="max-width:100%; border-radius:8px; display:block;">
      </div>
      <div class="row" style="justify-content:center; margin-top:14px;">
        <input id="titleInput" placeholder="輸入作品名稱…" style="width:260px;">
      </div>
      <div class="row" style="justify-content:center; margin-top:10px;">
        <button class="mint" onclick="submitTitle()">✅ 完成落款</button>
      </div>
    </div>
  `;
}

async function submitTitle(){
  const title = document.getElementById('titleInput').value.trim();
  if(!title){ alert('請輸入作品名稱'); return; }
  const g = await sget('group:'+currentStudent.groupId, null);
  if(!g) return;
  g.title = title;
  g.turnIndex = 6;
  await sset('group:'+currentStudent.groupId, g);
  renderStudentGroup();
}

function renderAnswerListHTML(cg){
  if(!cg || !cg.assignments) return '<p class="muted" style="color:var(--paper);">（沒有紀錄）</p>';
  const rows = CATS.slice(0,5).map((cat,i)=>{
    const order = i+1;
    const a = cg.assignments[order];
    const who = cg.members && cg.members.find(m=>m.order===order);
    return `<div class="chip" style="font-size:15px; padding:8px 14px;">${CAT_EMOJI[cat]} ${CAT_LABEL[cat]}：<b>${a? a.content : '—'}</b>${who? ` <span class="muted">(${who.name})</span>` : ''}</div>`;
  }).join('');
  return `<div class="row" style="justify-content:center; flex-wrap:wrap; margin-top:10px; max-width:640px;">${rows}</div>`;
}

/* =========================================================
   PROJECTOR
========================================================= */
function renderProjector(){
  clearPoll();
  projectorLoop();
  pollTimer = setInterval(projectorLoop, 2000);
}

async function projectorLoop(){
  const control = await sget('control:screen', {groupId:null, stage:'hidden'});
  if(control.stage==='hidden' || !control.groupId){
    root.innerHTML = `
      ${brand('大螢幕')}
      <button class="backlink" onclick="clearPoll();renderRoleSelect()">← 離開投影模式</button>
      <div class="big-screen">
        <h2 style="color:var(--paper); font-size:44px;">🎨 接力亂畫大會 🎲</h2>
        <p class="muted" style="color:var(--paper); opacity:.7;">等待老師公佈作品…</p>
      </div>
    `;
    return;
  }
  const g = await sget('group:'+control.groupId, null);
  if(!g) return;
  root.innerHTML = `
    ${brand('大螢幕')}
    <button class="backlink" onclick="clearPoll();renderRoleSelect()">← 離開投影模式</button>
    <div class="big-screen">
      <p class="pill" style="font-size:16px;">第 ${control.groupId} 組</p>
      ${g.image ? `<img src="${g.image}">` : '<p class="muted" style="color:var(--paper);">（尚無畫作）</p>'}
      ${control.stage==='title' || control.stage==='answer' ? `<div class="title-reveal">《${g.title||'（尚未命名）'}》</div>` : ''}
      ${control.stage==='answer' ? `<h3 style="color:var(--yellow); margin-top:10px;">🔓 正確答案公開！他們原本抽到的是…</h3>${renderAnswerListHTML(g)}` : ''}
    </div>
  `;
}

/* ---------------- init ---------------- */
renderRoleSelect();
